; PlatformIO Project Configuration for OutlanderBMS on T-2Can
; Based on T-2Can example configuration

[platformio]
default_envs = outlander_bms
; Custom board definitions live outside this repo
boards_dir = ../../Battery-Emulator/boards

[env:outlander_bms]
platform = espressif32 @6.5.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
board_upload.flash_size = 16MB

; Previous local T-2Can library path is not present in this repo checkout.
; Pull MCP2515 directly from the PlatformIO registry instead.

board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv

build_flags =
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

lib_deps =
    me-no-dev/ESPAsyncWebServer@^3.6.0
    me-no-dev/AsyncTCP@^1.1.1
    autowp/autowp-mcp2515@^1.3.1
    knolleary/PubSubClient@^2.8

; OTA upload of firmware that has already been bootstrapped over USB.
; Override the address when needed with: pio run -e outlander_bms_ota -t upload --upload-port <ip-or-hostname>
[env:outlander_bms_ota]
extends = env:outlander_bms
upload_protocol = espota
upload_port = 192.168.2.90
extra_scripts = post:scripts/ota_upload.py

; Native testing environment (runs on development machine)
[env:native]
platform = native
framework =
test_framework = unity
build_flags =
    -std=c++11
    -D UNIT_TEST
    -D ARDUINO=100
    -I test/mocks
build_src_filter =
    +<bms_data.cpp>
    +<soc_calc.cpp>
    +<protection.cpp>
    +<current_sense.cpp>
    +<ess_control.cpp>
    +<soc_curve_validation.cpp>
    +<../test/mocks/arduino_mock.cpp>
test_build_src = yes
lib_deps =
test_ignore = test_embedded
