; PlatformIO Project Configuration for OutlanderBMS on T-2Can
; Based on T-2Can example configuration

[env]
platform = espressif32 @6.5.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB

board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv

build_flags =
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

[platformio]
boards_dir = ../../T-2Can/boards
lib_dir = ../../T-2Can/libraries

[env:outlander_bms]
lib_deps =
    me-no-dev/ESPAsyncWebServer@^3.6.0
    me-no-dev/AsyncTCP@^1.1.1

; Native testing environment (runs on development machine)
[env:native]
platform = native
framework =
test_framework = unity
build_flags =
    -std=c++11
    -D UNIT_TEST
    -D ARDUINO=100
    -I test/mocks
build_src_filter =
    +<bms_data.cpp>
    +<soc_calc.cpp>
    +<protection.cpp>
    +<current_sense.cpp>
    +<../test/mocks/arduino_mock.cpp>
    +<../test/test_main.cpp>
    +<../test/test_bms_data.cpp>
    +<../test/test_soc_calc.cpp>
    +<../test/test_protection.cpp>
    +<../test/test_current_sense.cpp>
    +<../test/test_safety_critical.cpp>
test_build_src = true
lib_deps =
test_ignore = test_embedded
